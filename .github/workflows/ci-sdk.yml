name: CI (SDK)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (defaults to the triggering commit)'
        type: string
        required: false
        default: ''
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - packages/keydock-sdk/**
  pull_request:
    branches: [master]
    paths:
      - packages/keydock-sdk/**

# Via workflow_call, github.ref is the caller's ref (master): concurrent master runs queue, not cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/keydock-sdk

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/bun-setup
        with:
          working-directory: packages/keydock-sdk

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Summary
        if: always()
        shell: bash
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          if [[ "${{ job.status }}" == "success" ]]; then icon="✅"; else icon="❌"; fi
          printf "## %s SDK QA\n**ref:** \`%s\`\n" "${icon}" "${ref}" >> "${GITHUB_STEP_SUMMARY}"
