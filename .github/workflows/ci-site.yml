name: CI (Site)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - site/**
  pull_request:
    branches: [master]
    paths:
      - site/**
      # Release prepare only bumps workspace manifests — still validate site on that PR.
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  build:
    name: Site (Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: site/package.json

      - uses: ./.github/actions/bun-setup
        with:
          working-directory: site
          bun-version: "1.3.x"

      - name: Build
        run: bun run build
