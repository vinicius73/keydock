name: CI (Site)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - site/**
  pull_request:
    branches: [master]
    paths:
      - site/**
      # Release prepare only bumps workspace manifests — still validate site on that PR.
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  build:
    name: Site (Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-setup
        with:
          working-directory: site

      - name: Build
        run: bun run build

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then icon="✅"; else icon="❌"; fi
          printf "## %s Site build\n**ref:** \`%s\`\n" "${icon}" "${{ github.ref_name }}" >> "${GITHUB_STEP_SUMMARY}"
