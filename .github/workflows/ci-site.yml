name: CI (Site)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - site/**
  pull_request:
    branches: [master]
    paths:
      - site/**
      # Release prepare only bumps workspace manifests — still validate site on that PR.
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  build:
    name: Site (Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: site/package.json

      - uses: ./.github/actions/bun-setup
        with:
          working-directory: site
          bun-version: "1.3.x"

      - name: Build
        run: bun run build

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then icon="✅"; else icon="❌"; fi
          printf "## %s Site build\n**ref:** \`%s\`\n" "${icon}" "${{ github.ref_name }}" >> "${GITHUB_STEP_SUMMARY}"
