name: Release (publish)

run-name: Release (publish ${{ github.ref_name }})

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release-publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  validate-tag:
    name: Validate tag matches manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      npm_dist_tag: ${{ steps.check.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: check
        name: Verify Cargo.toml, package.json, and jsr.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"

          CARGO="$(grep -E '^version = ' Cargo.toml | head -n1 | sed -E 's/^version = "([^"]+)".*/\1/')"
          SDK="$(jq -r .version packages/keydock-sdk/package.json)"
          JSR="$(jq -r .version packages/keydock-sdk/jsr.json)"

          echo "Tag (without v): ${TAG}"
          echo "Cargo.toml workspace version: ${CARGO}"
          echo "package.json version: ${SDK}"
          echo "jsr.json version: ${JSR}"

          if [ "${TAG}" != "${CARGO}" ] || [ "${TAG}" != "${SDK}" ] || [ "${TAG}" != "${JSR}" ]; then
            echo "::error::Version mismatch: tag v${TAG} must match Cargo.toml, package.json, and jsr.json" >&2
            exit 1
          fi

          echo "version=${TAG}" >> "${GITHUB_OUTPUT}"

          # npm 11+ rejects prerelease publishes without an explicit --tag (it refuses
          # to let a pre-release accidentally become "latest"). We always resolve a
          # dist-tag so that publish steps can unconditionally pass --tag.
          # Mapping: 1.0.0-rc.1 -> "rc", 1.0.0-0 -> "next", 1.0.0 -> "latest".
          PRE="${TAG#*-}"
          if [ "${PRE}" != "${TAG}" ]; then
            LABEL="${PRE%%.*}"
            if [[ "${LABEL}" =~ ^[a-zA-Z][a-zA-Z0-9_-]*$ ]]; then
              NPM_TAG="${LABEL,,}"
            else
              NPM_TAG="next"
            fi
          else
            NPM_TAG="latest"
          fi
          echo "npm_dist_tag=${NPM_TAG}" >> "${GITHUB_OUTPUT}"
          echo "npm dist-tag: ${NPM_TAG}"

  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: validate-tag
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/keydock
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  build-binary:
    name: Build static Linux binary (musl)
    runs-on: ubuntu-latest
    needs: validate-tag
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/rust-setup

      - name: Install musl target and toolchain support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build release binary
        run: |
          cargo build --release --locked -p keydock --target x86_64-unknown-linux-musl

      - name: Package binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp target/x86_64-unknown-linux-musl/release/keydock keydock-linux-amd64
          sha256sum keydock-linux-amd64 > keydock-linux-amd64.sha256

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: keydock-linux-amd64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary
          retention-days: 1
          path: |
            keydock-linux-amd64
            keydock-linux-amd64.sha256

  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    needs: validate-tag
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/bun-setup
        with:
          working-directory: packages/keydock-sdk

      - name: Build distributable
        working-directory: packages/keydock-sdk
        run: bun run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-dist
          retention-days: 1
          path: packages/keydock-sdk/dist

  publish-npm:
    name: Publish SDK to npm
    runs-on: ubuntu-latest
    needs:
      - build-sdk
      - validate-tag
    timeout-minutes: 15
    # Trusted publishing via OIDC (no NPM_TOKEN required).
    # The trusted publisher on npmjs.com is bound to this exact workflow filename
    # (release-publish.yml) and the publish job below; do not rename either without
    # updating the npm package settings, otherwise publishing will fail with ENEEDAUTH.
    # See: https://docs.npmjs.com/trusted-publishers
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-dist
          path: packages/keydock-sdk/dist

      # Node 24 ships with npm >= 11.5.1, which is required for OIDC trusted publishing.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment automatically
      # and exchanges the workflow's id-token for a short-lived publish token.
      # No --provenance flag: npm auto-generates and publishes the attestation when
      # publishing from a public repo via trusted publishing.
      - name: Publish to npm (OIDC)
        working-directory: packages/keydock-sdk
        env:
          NPM_DIST_TAG: ${{ needs.validate-tag.outputs.npm_dist_tag }}
        run: npm publish --access public --tag "${NPM_DIST_TAG}"

  publish-ghp:
    name: Publish SDK to GitHub Packages
    runs-on: ubuntu-latest
    needs:
      - build-sdk
      - validate-tag
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-dist
          path: packages/keydock-sdk/dist

      - name: Scope package for GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          jq '.name = "@vinicius73/keydock-sdk" |
            .publishConfig = {"registry": "https://npm.pkg.github.com"}' \
            packages/keydock-sdk/package.json > /tmp/pkg-ghp.json
          mv /tmp/pkg-ghp.json packages/keydock-sdk/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@vinicius73"

      - name: Publish to GitHub Packages
        working-directory: packages/keydock-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_DIST_TAG: ${{ needs.validate-tag.outputs.npm_dist_tag }}
        run: npm publish --access public --tag "${NPM_DIST_TAG}"

  publish-jsr:
    name: Publish SDK to JSR
    runs-on: ubuntu-latest
    needs:
      - build-sdk
      - validate-tag
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/bun-setup
        with:
          working-directory: packages/keydock-sdk

      - name: Publish to JSR
        working-directory: packages/keydock-sdk
        run: bunx jsr publish

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-docker
      - build-binary
      - publish-npm
      - publish-ghp
      - publish-jsr
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary
          path: release-assets

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Mark as pre-release when the version contains a pre-release segment (e.g. 1.0.0-rc.1).
          pre_flag=""
          if [[ "${VERSION}" == *-* ]]; then
            pre_flag="--prerelease"
          fi

          assets=(
            release-assets/keydock-linux-amd64
            release-assets/keydock-linux-amd64.sha256
          )

          if gh release view "${TAG}" --repo "${{ github.repository }}" &>/dev/null; then
            # Idempotency: release already exists (e.g. re-run after a downstream failure).
            # Upload assets with --clobber so partial uploads from the previous run are
            # overwritten cleanly rather than leaving the release in an inconsistent state.
            echo "Release ${TAG} already exists; uploading/replacing assets."
            gh release upload "${TAG}" \
              --repo "${{ github.repository }}" \
              --clobber \
              "${assets[@]}"
          else
            # Atomic: creates the release and uploads assets in a single operation,
            # avoiding the draft→finalize race that caused "immutable release" errors.
            # shellcheck disable=SC2086
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --generate-notes \
              --verify-tag \
              ${pre_flag} \
              "${assets[@]}"
          fi

      - name: Summary
        shell: bash
        run: |
          version="${{ needs.validate-tag.outputs.version }}"
          repo="${{ github.repository }}"
          owner="${{ github.repository_owner }}"
          npm_tag="${{ needs.validate-tag.outputs.npm_dist_tag }}"
          {
            printf "## 🎉 v%s released\n\n" "${version}"
            printf "| | |\n|---|---|\n"
            printf "| GitHub Release | https://github.com/%s/releases/tag/v%s |\n" "${repo}" "${version}"
            printf "| Docker | \`ghcr.io/%s/keydock:%s\` |\n" "${owner}" "${version}"
            if [ -n "${npm_tag}" ]; then
              printf "| npm dist-tag | \`%s\` (install with \`npm i keydock-sdk@%s\`) |\n" "${npm_tag}" "${npm_tag}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
