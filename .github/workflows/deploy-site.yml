name: Deploy (Site → GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    defaults:
      run:
        working-directory: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-setup
        with:
          working-directory: site

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Astro expects site + base in config for project Pages ("/repo"). If the Pages API
      # returns an empty base_path, fall back to /REPO (skip for *.github.io root sites).
      - name: Astro URL for GitHub Pages
        id: astro_pages
        shell: bash
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          site="${{ steps.pages.outputs.origin }}"
          base="${BASE_PATH}"
          if [[ -z "${base}" && "${REPO_NAME}" != *.github.io ]]; then
            base="/${REPO_NAME}"
          fi
          echo "site=${site}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${base}" ]]; then
            echo "base=${base}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build with Astro
        run: bun run build
        env:
          ASTRO_SITE: ${{ steps.astro_pages.outputs.site }}
          ASTRO_BASE: ${{ steps.astro_pages.outputs.base }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          retention-days: 1

      - name: Summary
        if: success()
        shell: bash
        run: |
          printf "## ✅ Site artifact ready\n\n**Branch:** \`%s\`\n**SHA:** \`%s\`\n" \
            "${{ github.ref_name }}" "${{ github.sha }}" >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        shell: bash
        run: |
          printf "## 🌐 GitHub Pages\n\n%s\n" "${{ steps.deployment.outputs.page_url }}" >> "${GITHUB_STEP_SUMMARY}"
