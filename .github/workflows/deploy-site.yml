name: Deploy (Site → GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: site/package.json

      - uses: ./.github/actions/bun-setup
        with:
          working-directory: site
          bun-version: "1.3.x"

      # configure-pages v6 does not patch Astro config; pass URL metadata via the CLI.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Astro
        run: |
          bun run astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          retention-days: 1

      - name: Summary
        if: success()
        shell: bash
        run: |
          printf "## ✅ Site artifact ready\n\n**Branch:** \`%s\`\n**SHA:** \`%s\`\n" \
            "${{ github.ref_name }}" "${{ github.sha }}" >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        shell: bash
        run: |
          printf "## 🌐 GitHub Pages\n\n%s\n" "${{ steps.deployment.outputs.page_url }}" >> "${GITHUB_STEP_SUMMARY}"
