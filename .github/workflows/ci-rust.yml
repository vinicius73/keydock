name: CI (Rust)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (defaults to the triggering commit)'
        type: string
        required: false
        default: ''
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - apps/**
  pull_request:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - apps/**

# Via workflow_call, github.ref is the caller's ref (master): concurrent master runs queue, not cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation adds no value in CI: each run restores a cache
  # snapshot rather than continuing a live dev session.
  CARGO_INCREMENTAL: 0
  # RUSTFLAGS replaces (not appends) build.rustflags from .cargo/config.toml,
  # so -D warnings must be repeated here explicitly.
  # -C debuginfo=0 strips debug symbols to keep the cache small.
  RUSTFLAGS: "-D warnings -C debuginfo=0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          cache-on-failure: "true"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Summary
        if: always()
        shell: bash
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          if [[ "${{ job.status }}" == "success" ]]; then icon="✅"; else icon="❌"; fi
          printf "## %s Rust — fmt + clippy\n**ref:** \`%s\`\n" "${icon}" "${ref}" >> "${GITHUB_STEP_SUMMARY}"

  test:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/rust-setup
        with:
          cache-on-failure: "true"

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then icon="✅"; else icon="❌"; fi
          printf "## %s Rust — test\n" "${icon}" >> "${GITHUB_STEP_SUMMARY}"
