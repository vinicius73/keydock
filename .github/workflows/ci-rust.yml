name: CI (Rust)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (defaults to the triggering commit)'
        type: string
        required: false
        default: ''
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - apps/**
  pull_request:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - apps/**

# Via workflow_call, github.ref is the caller's ref (master): concurrent master runs queue, not cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          cache-on-failure: "true"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/rust-setup

      - name: cargo test
        run: cargo test --workspace --locked
