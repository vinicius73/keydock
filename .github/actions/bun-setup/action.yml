name: Bun Setup
description: >
  Install Bun, restore the Bun install cache, and run bun install with a frozen lockfile.

inputs:
  working-directory:
    description: Directory containing bun.lock (relative to the repository root).
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: ".bun-version"

    - uses: actions/cache@v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
        restore-keys: bun-${{ runner.os }}-${{ inputs.working-directory }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile
