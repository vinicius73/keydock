name: Rust Setup
description: >
  Install the pinned toolchain from rust-toolchain.toml and restore the
  Cargo dependency cache. All consumers share the same cache key.

inputs:
  components:
    description: Comma-separated extra rustup components (e.g. "rustfmt, clippy").
    required: false
    default: ""
  cache-on-failure:
    description: Save the Cargo cache even when the calling job fails.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Read the channel declared in rust-toolchain.toml so it is passed explicitly.
    # dtolnay/rust-toolchain requires the `toolchain` input at the pinned SHA.
    - name: Read toolchain channel from rust-toolchain.toml
      id: toolchain
      shell: bash
      run: |
        channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
        echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

    # No versioned releases exist for this action; pinned to a SHA for immutability.
    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-04-29)
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}

    # Swatinem/rust-cache v2 includes rust-toolchain.toml, Cargo.lock, and RUSTFLAGS
    # in its key hash automatically, so shared-key only needs to scope by OS.
    - uses: Swatinem/rust-cache@v2.9.1
      with:
        shared-key: rust-${{ runner.os }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
